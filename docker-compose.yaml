version: '3.8'

services:
  backend:
    build:
      dockerfile: backend/Dockerfile
      context: .
    ports:
      - "8003:8003"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/domains')"]
      interval: 30s
      timeout: 5s
      retries: 35
      start_period: 30s

  frontend:
    build:
      dockerfile: frontend/Dockerfile
      context: .
    ports:
      - "8004:8004"
    environment:
      - BACKEND_URL=http://backend:8003
    depends_on:
      backend:
        condition: service_healthy

  database:
    image: mariadb:11.7.2-ubi9
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=biar
      - MYSQL_DATABASE=db_progetto
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.30.0-rc20
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
